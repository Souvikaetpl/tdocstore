[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdocstore"
version = "0.1.0"
description = "Self-hosted 3GPP TDoc data layer: crawl, extract, index, serve via MCP/REST/import"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "mcp>=1.2",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]

[project.scripts]
tdocstore = "tdocstore.cli:main"
tdocstore-mcp = "tdocstore.mcp_server:main"

[tool.setuptools.packages.find]
include = ["tdocstore*"]
